name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
          cache: "yarn"
      - run: corepack enable
      - run: yarn install
      - run: yarn lint
      - run: yarn next:check-types
      - run: yarn test
      - run: yarn next:build
